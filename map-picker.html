<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pick coordinates for satellite image</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Mapbox GL JS CSS + JS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.js"></script>

  <!-- Mapbox GL Geocoder CSS + JS -->
    <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v7.0.0/mapbox-gl-geocoder.css"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v7.0.0/mapbox-gl-geocoder.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      max-width: 280px;
      font-size: 14px;
    }
    #controls h1 {
      margin: 0 0 6px;
      font-size: 16px;
    }
    #coords-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 8px 0;
    }
    .coord-field {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coord-field label {
      width: 35px;
      font-weight: 600;
      font-size: 12px;
    }
    .coord-field input {
      flex: 1;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    button {
      cursor: pointer;
      border-radius: 4px;
      border: none;
      padding: 6px 10px;
      font-size: 13px;
    }
    #copy-btn {
      background: #0366d6;
      color: white;
      margin-right: 6px;
    }
    #copy-btn:active,
    #run-btn:active {
      transform: translateY(1px);
    }
    #hint {
      font-size: 12px;
      color: #555;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #333;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <h1>Pick a location</h1>
    <div id="hint">
      1. Click on the map<br />
      2. (Optional) Copy the coordinates<br />
      3. Click "Get satellite image"
    </div>

    <div id="coords-row">
      <div class="coord-field">
        <label for="lat-input">Lat</label>
        <input id="lat-input" type="text" readonly />
      </div>
      <div class="coord-field">
        <label for="lon-input">Lon</label>
        <input id="lon-input" type="text" readonly />
      </div>
    </div>

    <button id="copy-btn" type="button">Copy "lat, lon"</button>
    <button id="run-btn" type="button">Get satellite image</button>

    <div id="status"></div>
  </div>

  <script>
    // 1. Mapbox access token (PUBLIC token, from your Mapbox account)
    mapboxgl.accessToken = 'pk.eyJ1IjoicmFzaGktZCIsImEiOiJjbWlmcXh3bjAwMDVyM2RxeDhnemh0bTd3In0.Sf7hDPEoF09bsu2s1CSBAA';

    // 2. Create the map
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-streets-v12',
      center: [0, 20],
      zoom: 2
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    // Add search bar (Mapbox Geocoder)
    const geocoder = new MapboxGeocoder({
    accessToken: mapboxgl.accessToken,
    mapboxgl: mapboxgl,
    placeholder: 'Search for a place',
    marker: false  // we’ll still use our own marker on click
    });
    map.addControl(geocoder, 'top-left');

    // 3. Grab UI elements
    const latInput = document.getElementById('lat-input');
    const lonInput = document.getElementById('lon-input');
    const copyBtn = document.getElementById('copy-btn');
    const runBtn = document.getElementById('run-btn');
    const statusDiv = document.getElementById('status');

    let marker = null;

    function updateCoords(lngLat) {
      const lat = lngLat.lat.toFixed(6);
      const lon = lngLat.lng.toFixed(6);

      latInput.value = lat;
      lonInput.value = lon;

      if (marker) {
        marker.setLngLat(lngLat);
      } else {
        marker = new mapboxgl.Marker().setLngLat(lngLat).addTo(map);
      }
    }

    // 4. Map click → update coords
    map.on('click', (event) => {
      updateCoords(event.lngLat);
    });

    // 5. Copy button
    copyBtn.addEventListener('click', async () => {
      const lat = latInput.value;
      const lon = lonInput.value;
      if (!lat || !lon) {
        alert('Click on the map first to pick a location.');
        return;
      }

      const text = `${lat}, ${lon}`;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy "lat, lon"'; }, 1500);
      } catch (err) {
        alert(`Could not copy automatically.\nCopy manually:\n${text}`);
      }
    });

    // 6. Run workflow button
    runBtn.addEventListener('click', async () => {
      const lat = latInput.value;
      const lon = lonInput.value;

      if (!lat || !lon) {
        alert('Click on the map first to pick a location.');
        return;
      }

      statusDiv.textContent = 'Triggering GitHub workflow...';

      try {
        const resp = await fetch('http://127.0.0.1:8000/run-workflow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon }),
        });

        let data = {};
        try {
          data = await resp.json();
        } catch (e) {}

        if (resp.ok) {
          statusDiv.textContent =
            (data && data.message) || 'Workflow triggered! Check GitHub → Actions.';
        } else {
          statusDiv.textContent =
            'Error from server: ' + (data.error || data.github_response || resp.statusText);
        }
      } catch (err) {
        statusDiv.textContent = 'Network error: ' + err;
      }
    });
  </script>
</body>
</html>
